<!doctype html>
<!-- pwa-kit: shell/index.html v6 -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover for the safe areas; no user scaling because this is
         an app, not a page (a deliberate choice - see reference/shell.md). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <title>My App</title>
    <meta name="description" content="" />

    <meta name="theme-color" content="#3d5a40" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="My App" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
  </head>
  <body>
    <div id="app"></div>
    <!-- Captured here, before the bundle: the event fires before Svelte mounts
         and a component listener misses it. InstallBanner picks it up. -->
    <script>window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__pwaInstallPrompt=e})</script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
